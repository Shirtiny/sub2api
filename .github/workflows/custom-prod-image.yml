name: Container Image Release

on:
  push:
    tags:
      - 'cafecode-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example cafecode-v1.2.3 or cafecode-v1.2.3-rc.1'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      major_minor: ${{ steps.check.outputs.major_minor }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      make_latest: ${{ steps.check.outputs.make_latest }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Validate release tag
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^cafecode-v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            echo "Expected: cafecode-v1.2.3, cafecode-v1.2.3-alpha.1, cafecode-v1.2.3-beta.1, or cafecode-v1.2.3-rc.1" >&2
            exit 1
          fi

          VERSION="${TAG#cafecode-v}"
          MAJOR_MINOR="$(awk -F. '{print $1 "." $2}' <<< "$VERSION")"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0

      - name: Capture release context
        id: context
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          mkdir -p release-record

          find backend/migrations -type f -name '*.sql' -print | LC_ALL=C sort > release-record/migrations.files
          while IFS= read -r file; do
            sha256sum "$file"
          done < release-record/migrations.files > release-record/migrations.sha256

          grep -E '/[^/]*backfill[^/]*\.sql$' release-record/migrations.files > release-record/backfill-migrations.files || true
          while IFS= read -r file; do
            sha256sum "$file"
          done < release-record/backfill-migrations.files > release-record/backfill-migrations.sha256

          MIGRATION_HASH="$(sha256sum release-record/migrations.sha256 | awk '{print $1}')"
          MIGRATION_FILES_HASH="$(sha256sum release-record/migrations.files | awk '{print $1}')"
          BACKFILL_HASH="$(sha256sum release-record/backfill-migrations.sha256 | awk '{print $1}')"
          BACKFILL_FILES_HASH="$(sha256sum release-record/backfill-migrations.files | awk '{print $1}')"
          MIGRATION_COUNT="$(wc -l < release-record/migrations.files | tr -d ' ')"
          BACKFILL_COUNT="$(wc -l < release-record/backfill-migrations.files | tr -d ' ')"
          LATEST_MIGRATION="$(tail -n 1 release-record/migrations.files | sed 's#^backend/migrations/##')"

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_time=${BUILD_TIME}"
            echo "migration_hash=${MIGRATION_HASH}"
            echo "migration_files_hash=${MIGRATION_FILES_HASH}"
            echo "backfill_hash=${BACKFILL_HASH}"
            echo "backfill_files_hash=${BACKFILL_FILES_HASH}"
            echo "migration_count=${MIGRATION_COUNT}"
            echo "backfill_count=${BACKFILL_COUNT}"
            echo "latest_migration=${LATEST_MIGRATION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.preflight.outputs.image }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.tag }}
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=${{ needs.preflight.outputs.major_minor }},enable=${{ needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.make_latest == 'true' }}
            type=raw,value=rc,enable=${{ contains(needs.preflight.outputs.tag, '-rc.') }}
            type=raw,value=beta,enable=${{ contains(needs.preflight.outputs.tag, '-beta.') }}
            type=raw,value=alpha,enable=${{ contains(needs.preflight.outputs.tag, '-alpha.') }}
            type=raw,value=sha-${{ steps.context.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=sub2api
            org.opencontainers.image.description=Sub2API - AI API Gateway Platform
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.context.outputs.sha }}
            org.opencontainers.image.created=${{ steps.context.outputs.build_time }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            COMMIT=${{ steps.context.outputs.sha }}
            DATE=${{ steps.context.outputs.build_time }}

      - name: Generate image build record
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA: ${{ steps.context.outputs.sha }}
          BUILD_TIME: ${{ steps.context.outputs.build_time }}
          MIGRATION_HASH: ${{ steps.context.outputs.migration_hash }}
          MIGRATION_FILES_HASH: ${{ steps.context.outputs.migration_files_hash }}
          MIGRATION_COUNT: ${{ steps.context.outputs.migration_count }}
          LATEST_MIGRATION: ${{ steps.context.outputs.latest_migration }}
          BACKFILL_HASH: ${{ steps.context.outputs.backfill_hash }}
          BACKFILL_FILES_HASH: ${{ steps.context.outputs.backfill_files_hash }}
          BACKFILL_COUNT: ${{ steps.context.outputs.backfill_count }}
        run: |
          set -euo pipefail

          cat > "release-record/image-build-${TAG}.md" <<EOF
          # Image Build Record

          - git tag: \`${TAG}\`
          - version: \`${VERSION}\`
          - git sha: \`${SHA}\`
          - image: \`${IMAGE}\`
          - image digest: \`${DIGEST}\`
          - build time: \`${BUILD_TIME}\`
          - workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Tags

          \`\`\`
          ${TAGS}
          \`\`\`

          ## Migration SQL

          - latest migration file: \`${LATEST_MIGRATION}\`
          - migration SQL count: \`${MIGRATION_COUNT}\`
          - migration SQL content-list hash: \`${MIGRATION_HASH}\`
          - migration SQL file-list hash: \`${MIGRATION_FILES_HASH}\`
          - backfill SQL count: \`${BACKFILL_COUNT}\`
          - backfill SQL content-list hash: \`${BACKFILL_HASH}\`
          - backfill SQL file-list hash: \`${BACKFILL_FILES_HASH}\`

          ## Deploy / rollback identity

          Prefer deploying the immutable digest:

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`
          EOF

      - name: Upload image build record
        uses: actions/upload-artifact@v4
        with:
          name: image-build-record-${{ needs.preflight.outputs.tag }}
          path: release-record/*
