<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{SUBJECT}} · {{SITE_NAME}}</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body, table, td, p, h1 { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0; mso-table-rspace: 0; }
    @media screen and (max-width: 480px) {
      .outer-pad { padding: 20px 12px !important; }
      .masthead { padding: 28px 24px !important; }
      .letter { padding: 36px 24px 30px !important; }
      .headline { font-size: 28px !important; line-height: 1.5 !important; letter-spacing: -0.6px !important; }
      .brand { font-size: 30px !important; }
      .signoff { padding: 24px !important; }
    }
    @media (prefers-color-scheme: dark) {
      .page { background-color: #171411 !important; }
      .paper { background-color: #27211b !important; border-color: #493c30 !important; }
      .masthead { background-color: #201b16 !important; }
      .ink { color: #f2e9dc !important; }
      .body-copy { color: #d6c9b9 !important; }
      .muted { color: #b6a492 !important; }
      .accent { color: #d8ad7d !important; }
      .receipt { background-color: #30281f !important; border-color: #4b3d2e !important; }
      .rule { border-color: #493c30 !important; }
      .small-rule { background-color: #d8ad7d !important; }
    }
  </style>
</head>
<body class="page" style="margin:0;padding:0;width:100%;background-color:#eee8df;color:#382a20;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{PREHEADER}}</div>
  <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#eee8df;">
    <tr>
      <td class="outer-pad" align="center" style="padding:48px 20px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" class="paper" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;table-layout:fixed;background-color:#faf7f2;border:1px solid #dcd0c0;border-radius:12px;border-spacing:0;">
          <tr>
            <td class="masthead" bgcolor="#30251d" style="padding:32px 44px;background-color:#30251d;border-radius:11px 11px 0 0;border-bottom:3px solid #be956a;">
              <p style="margin:0 0 12px;color:#d0b698;font-size:10px;line-height:16px;letter-spacing:2.6px;">A NOTE FROM US</p>
              <p class="brand" style="margin:0;color:#fbf3e7;font-family:Georgia,'Times New Roman','Songti SC',serif;font-size:36px;font-style:italic;line-height:1.25;letter-spacing:-0.8px;overflow-wrap:anywhere;word-wrap:break-word;">{{SITE_NAME}}</p>
            </td>
          </tr>
          <tr>
            <td class="letter" style="padding:44px 44px 36px;">
              <p class="accent" style="margin:0 0 18px;color:#865630;font-size:10px;line-height:18px;letter-spacing:2px;">{{KICKER}}</p>
              <h1 class="headline ink" style="margin:0;color:#382a20;font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:36px;font-weight:400;line-height:1.5;letter-spacing:-0.8px;">{{HEADLINE}}</h1>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
                <tr><td class="small-rule" width="32" height="2" bgcolor="#ad8158" style="width:32px;height:2px;background-color:#ad8158;font-size:0;line-height:0;">&nbsp;</td></tr>
              </table>
              <p class="body-copy" style="margin:0;color:#685648;font-size:15px;line-height:2;">{{MESSAGE}}</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin-top:30px;">
                <tr>
                  <td class="receipt" style="padding:16px 20px;background-color:#f0e9df;border:1px solid #e4d8c8;border-radius:6px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                      <tr>
                        <td class="muted" style="color:#796653;font-size:12px;line-height:22px;">申请状态</td>
                        <td class="accent" align="right" style="color:#865630;font-size:13px;font-weight:500;line-height:22px;">{{STATUS}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              {{NEXT_STEPS}}
            </td>
          </tr>
          <tr>
            <td class="signoff rule" style="padding:26px 44px 28px;border-top:1px solid #e4d9ca;">
              <p class="ink" style="margin:0 0 7px;color:#382a20;font-family:'Songti SC','STSong','Noto Serif CJK SC',Georgia,serif;font-size:16px;line-height:26px;">让灵感，高效落地。</p>
              <p class="muted" style="margin:0;color:#8b7662;font-size:11px;line-height:20px;letter-spacing:0.3px;">{{SIGNOFF}}</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
        <p class="muted" style="margin:20px 0 0;color:#86705c;font-size:10px;line-height:18px;letter-spacing:1.4px;">GOOD IDEAS, FRESHLY BREWED.</p>
      </td>
    </tr>
  </table>
</body>
</html>
